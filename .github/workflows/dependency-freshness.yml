name: Dependency freshness

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check declared floors against PyPI
        id: freshness
        continue-on-error: true
        run: python tools/check_dependency_freshness.py --strict --github-output

      - name: Publish report
        if: always()
        run: cat dependency-freshness-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Require review when a floor has aged
        if: steps.freshness.outcome == 'failure'
        run: |
          echo "::error::A declared dependency floor has aged or the check failed."
          exit 1
